# Build and publish the FontPacker API reference.
#
# `Doxyfile` is the single source of truth for the render: it consumes the two
# Markdown documents (README.md as the main page, BINARY_FORMAT.md as the format
# specification) and every *.hpp in the repository. The theme comes from the
# `doxygen-awesome-css` git submodule, so the checkout must be recursive.
#
# The job produces `build/doxygen/html` (the shadow build tree; `build*/` is
# git-ignored) and then:
#   * uploads it as the `doxygen-html` artifact on every run, so the site can be
#     inspected without a local Doxygen installation, and
#   * deploys it to GitHub Pages when the push targets `master`.
#
# This is the repository's only Pages publisher. A Pages deployment replaces the
# whole published site, so a second deployer would overwrite this one instead of
# adding to it. Add pages to this render rather than adding another workflow.
#
# One-time repository setup: Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". Without it the deploy job fails with
# "Get Pages site failed"; the artifact is still uploaded and the render job
# still passes.
#
# The documentation render intentionally does not compile the application: it
# needs no Qt, FreeType, HarfBuzz or libsvgtiny, only Doxygen and the theme.
# Building the project belongs to a separate build/test workflow, not here.

name: Doxygen

on:
  push:
    branches: [master]
  # A manual dispatch from any branch renders and uploads the artifact; the
  # deploy job below is restricted to `master`.
  workflow_dispatch:

permissions:
  contents: read

# Pages deployments are serialised, never cancelled half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with OUTPUT_DIRECTORY + HTML_OUTPUT in Doxyfile.
  SITE_DIR: build/doxygen/html
  # Doxygen's stderr, kept next to the site in the shadow build tree.
  LOG: build/doxygen.log

jobs:
  render:
    name: Render the reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree and the theme
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen
          doxygen --version

      - name: Render the site
        run: |
          # A broken Doxygen run must fail the step even though the output is
          # piped through tee.
          set -o pipefail
          # Doxygen creates build/doxygen/html itself but not its parents, and
          # a fresh checkout has no build/ directory (it is git-ignored).
          mkdir -p build
          doxygen Doxyfile 2>&1 | tee "$LOG"
          # Guard against an empty or misconfigured render: without index.html
          # the artifact is useless and Pages would serve a 404.
          test -f "$SITE_DIR/index.html"

      - name: Surface Doxygen warnings
        if: always()
        run: |
          if [ ! -f "$LOG" ]; then
            exit 0
          fi
          if [ -s "$LOG" ]; then
            # WARN_AS_ERROR = NO in Doxyfile is deliberate: the config is a work
            # list, so a warning becomes an annotation instead of a red build.
            # The committed Doxyfile enables WARN_IF_UNDOCUMENTED and
            # WARN_NO_PARAMDOC; a clean run therefore means every header member
            # has a doc block.
            sed "s|$GITHUB_WORKSPACE/||g" "$LOG" | while IFS= read -r line; do
              echo "::warning title=Doxygen::$line"
            done
          else
            echo "The render was warning-free."
          fi

      - name: Summarise the render
        if: success()
        run: |
          {
            echo "### Doxygen reference"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Doxygen | \`$(doxygen --version)\` |"
            echo "| HTML pages | $(find "$SITE_DIR" -name '*.html' | wc -l) |"
            echo "| Site size | $(du -sh "$SITE_DIR" | cut -f1) |"
            echo "| Warnings | $(wc -l < "$LOG") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: ${{ env.SITE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
          # Consumed by the deploy job of this run only; the artifact above is
          # the one to keep and download.
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: render
    # Only master replaces the published site; Pages validates the ref against
    # the github-pages environment's protection rules.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages configuration and fails with a clear message if the
      # source is not "GitHub Actions", before the deployment is attempted.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
